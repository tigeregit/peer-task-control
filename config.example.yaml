# peer-task-control 节点配置。不需要填写邻居名单。
# 复制到数据目录的 config.yaml，或用 ptc daemon --config 指定。

# 节点显示名，默认是主机名。
# name: iamsbb2

# 组网监听，固定端口 18765。
listen: 0.0.0.0:18765

# 本机 CLI / 控制 API，默认只绑 loopback。
api: 127.0.0.1:18780

# 数据与身份密钥目录。留空则用系统用户配置目录下的 ptc。
# data_dir: ""

# 受信任网段。来自这些网段的设备都被视为可信；网段外的连接一律拒绝。
# 至少写一条。本机测试可加上 127.0.0.0/8。
trusted_cidrs:
  - 192.168.0.0/16
  - 10.0.0.0/8

# 可选。32 字节密钥的 hex（64 个字符），只用来挡住网段外的误连。
# 集群内所有节点必须相同。留空表示不启用。
# psk: ""

# 本机提供的服务。exec 若本机没有 NVIDIA GPU，目录里仍会标为不可用。
services:
  exec: true
  files: true
  relay: false

# 本机操作策略。名单为空且功能开启，表示接受受信任网段内所有对端。
# 条目可以是 IP、CIDR、节点名或 peer ID。
policy:
  allow: []
  deny: []

# 网关（relay: true）扫描受信任网段的间隔。
scan_interval: 30s

# 额外探测目标（主机名、IP，或 host:port）。解析到的地址也会被准入。
# 用来把本机 Windows 节点接到 Docker 网格：gateway 写 host.docker.internal。
# scan_hosts:
#   - host.docker.internal

# 独立的数据路径。留空则都放在 data_dir 下。可把工作树放到更快的盘，
# 例如 Windows 上的 D:\ptc\worktrees。也可用环境变量或命令行覆盖：
#   PTC_SEEDS_DIR / --seeds-dir
#   PTC_WORKTREES_DIR / --worktrees-dir
#   PTC_RUNS_DIR / --runs-dir
#   PTC_DATA_DIR / --data-dir
# storage:
#   seeds_dir: ""        # 其下是 cas/ 和 packages/（种子与结果包）
#   worktrees_dir: ""    # 每次运行物化出的工作树；清工作树不会删种子
#   runs_dir: ""         # 运行记录和作业队列
#   size_limit: 40GB     # packages（含输出）+ CAS + Bitswap blocks + .fetch 合计
#   delete_size: 20GB    # 每轮自动清理目标；省略时为 size_limit 的一半
#   workspace_limit: 0  # 全部 workspace 合计；0 表示不限制
#
# workspace 不得与上述实际做种目录相同或互相嵌套（解析符号链接后校验）。
# 默认 data_dir 只是共同父目录，worktrees/ 与 cas/、packages/ 等仍然分离。
# 完成、失败、取消的任务立即回收 workspace；输入和输出都作为普通种子保留。
# free < size_limit 时：实际上限=max(0, free-1GB)，清理目标按原配置比例缩放。
# 例如 40GB/20GB、free=11GB，则实际为 10GB/5GB。
# 仅在对端完整校验并持久承诺保留另一份副本后才删除本机数据；
# 无足够安全副本时会明确报错，不会删除唯一、pin 或活跃任务需要的数据。

# 执行节点同时跑几个作业。默认 1，后来的作业排队。
# exec:
#   concurrency: 1

# 允许其他受信任节点经协议远程清理本机种子 / 工作树 / 记录。默认关闭。
# ptc clean 默认只作用于本机。
# policy.remote_clean: false

# 是否接受受信任、已记录安装的对端发起的同主版本网格升级。默认开启。
# 运行时可用 ptc policy update off 关闭。
# update:
#   accept_remote: true
