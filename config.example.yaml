# peer-task-control node config. You do not need to list neighbors.
# Copy this to config.yaml in the data directory, or pass it with ptc daemon --config.

# Display name of the node. Defaults to the hostname.
# name: iamsbb2

# Mesh listen address. The port is fixed at 18765.
listen: 0.0.0.0:18765

# Local CLI / control API. Bind to loopback by default.
api: 127.0.0.1:18780

# Data and identity-key directory. Leave empty to use ptc under the system user config directory.
# data_dir: ""

# Trusted segments. Devices in these CIDRs are treated as trusted; connections from outside are always refused.
# At least one entry is required. For local testing you may add 127.0.0.0/8.
trusted_cidrs:
  - 192.168.0.0/16
  - 10.0.0.0/8

# Optional. Hex of a 32-byte key (64 characters). Only used to block accidental connections from outside the segments.
# Every node in the cluster must use the same value. Leave empty to disable.
# psk: ""

# Services this host offers. If exec is on but this machine has no NVIDIA GPU, the catalog still marks it unavailable.
services:
  exec: true
  files: true
  relay: false

# Local operational policy. An empty list with the feature on means every peer in the trusted segments is accepted.
# An entry may be an IP, a CIDR, a node name, or a peer ID.
policy:
  allow: []
  deny: []

# Scan period. 0s means an infinite interval: scan once at start, then discover neighbors passively.
# A positive value (for example 5m) waits that long after each scan finishes, then scans again.
# A relay scans every trusted segment; an ordinary node only scans its own trusted segments.
scan_interval: 0s

# Global minimum interval for manually triggered scans. Default 60s; must be positive.
# Local ptc scan and every remote request share one budget; it is not counted per requesting node.
# A duplicate trigger is refused while a scan is running or waiting. A refused request does not extend the cooldown.
scan_min_interval: 60s

# Extra probe targets (hostname, IP, or host:port). Resolved addresses are also admitted.
# Used to join a local Windows node to a Docker mesh: the gateway should list host.docker.internal.
# scan_hosts:
#   - host.docker.internal

# Independent data paths. Leave empty to keep everything under data_dir. You can put worktrees on a faster disk,
# for example D:\ptc\worktrees on Windows. These can also be overridden by environment variables or flags:
#   PTC_SEEDS_DIR / --seeds-dir
#   PTC_WORKTREES_DIR / --worktrees-dir
#   PTC_RUNS_DIR / --runs-dir
#   PTC_DATA_DIR / --data-dir
# storage:
#   seeds_dir: ""        # contains cas/ and packages/ (seeds and result packages)
#   worktrees_dir: ""    # worktree materialized for each run; cleaning worktrees does not delete seeds
#   runs_dir: ""         # run records and the job queue
#   size_limit: 40GB     # packages (including output) + CAS + Bitswap blocks + .fetch, combined
#   delete_size: 20GB    # automatic cleanup target per round; defaults to half of size_limit when omitted
#   workspace_limit: 0  # combined size of all workspaces; 0 means unlimited
#
# A workspace must not be the same as, or nested with, the actual seeding directories above (checked after resolving symlinks).
# The default data_dir is only a shared parent; worktrees/ stays separate from cas/, packages/, and the rest.
# Workspaces of finished, failed, or cancelled jobs are reclaimed immediately. Inputs and outputs are kept as ordinary seeds.
# When free < size_limit: effective cap = max(0, free-1GB), and the cleanup target is scaled by the original ratio.
# For example, 40GB/20GB with free=11GB becomes 10GB/5GB.
# Local data is deleted only after a peer has fully verified another replica and persisted a retention commitment.
# If there is no sufficiently safe replica, the node errors clearly and does not delete unique, pinned, or active-job data.

# How many jobs an exec node runs at once. Default 1; later jobs queue.
# exec:
#   concurrency: 1

# Allow other trusted nodes to clean local seeds / worktrees / records over the protocol. Off by default.
# Without this, ptc clean --node <this-node> is refused. Local ptc clean still works.
# policy.remote_clean: false

# Whether to accept a same-major-version mesh upgrade from a trusted peer that has a recorded install. On by default.
# Turn it off at runtime with ptc policy update off.
# update:
#   accept_remote: true
