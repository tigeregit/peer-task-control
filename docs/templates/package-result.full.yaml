# Full ptc Package result settings template.
# Pointed at by with.file of the last Package result step in a workflow.
# Parsing this file should yield: paths to collect, packaging and publish method, and summary/cleanup policy.
# Copy it and change values for the real job. Commented keys are optional; uncomment them when needed.
#
# schema: ptc/v0    corresponds to uses: ptc/package-result@v0

apiVersion: ptc/v0
kind: PackageResult

metadata:
  name: scene-a-cuda-test-results
  description: "Pack results and logs under out/ into a content-addressed seed, write the summary, and reclaim the temporary worktree."

# 1) Which paths to collect from the worktree (all relative to the worktree root, and inside the Prepare layout).
collect:
  # If true, first include the paths listed in outputs in prepare.yaml, then merge the entries below (the same path is overridden here).
  from_prepare_outputs: true
  items:
    - name: results
      path: out/results
      required: true
      summary: true
    - name: logs
      path: out/logs
      required: false
      summary: false
  # exclude:
  #   - out/results/.cache

# 2) Packaging. The default is a content-addressed directory tree that keeps the relative layout, so it can later be reused as a Prepare seed.
package:
  # unixfs: consistent with P1 CAS / filestore. Switch to tar or zip when you need a single archive.
  format: unixfs
  preserve_layout: true
  # compression: zstd
  # Whole-package cap. Crossing it fails this step, and cleanup must not delete an unpublished result.
  # max_bytes: 20GiB

# 3) Publish as a fetchable seed. Results are temporary by default; long-term retention requires an explicit pin, preferably on a files node.
publish:
  class: temporary
  pin: false
  to:
    any_replica: true
    prefer: [files]
  seed:
    name: scene-a-results
    # digest / cid are written by the runtime after packaging; you do not need to fill them at submit time.
    # digest: sha256:...
    # cid: bafy...

# 4) Job summary: shown as the run result in the WebUI (similar to a GitHub Actions job summary).
summary:
  include_exit_code: true
  # If the following files exist, include them in the summary body or as attachments.
  files:
    - path: out/results/summary.md
      required: false
    - path: out/results/metrics.json
      required: false
  # annotations_from: out/results/annotations.yaml

# 5) Cleanup after a successful package and publish, so temporary output does not fill the exec node's disk.
cleanup:
  # success: clean only after a successful publish; always: also delete undeclared data after a packaging failure (still must not delete a result that was not published successfully).
  when: success
  evict_worktree: true
  evict_unpackaged: true
  # When this section and Prepare layout.keep_on_success / keep_on_failure both apply, this section wins.
