# Example ptc job outline (Actions-style jobs/steps, not GitHub-hosted CI).
# This file is not executed by ptc submit as-is.
# Every job must start with Prepare and end with Package result; both steps only point at their own YAML.

name: scene-a-cuda-test

jobs:
  test:
    steps:
      - name: Prepare
        uses: ptc/prepare@v0
        with:
          file: prepare.yaml

      - name: Run tests
        run: .\bin\app.exe --data in\scene --out out\results

      - name: Package result
        uses: ptc/package-result@v0
        with:
          file: package-result.yaml
