# Native Windows host node joining the Docker deploy mesh.
# The gateway probes host.docker.internal:18765; Docker Desktop delivers
# that connection to this process as 127.0.0.1, so loopback must be trusted.
# Add your real LAN CIDRs if this node should accept other machines.
name: host
listen: 0.0.0.0:18765
api: 127.0.0.1:18780
trusted_cidrs:
  - 127.0.0.0/8
  - 10.88.0.0/24
services:
  exec: true
  files: true
  relay: false
policy:
  allow: []
  deny: []
scan_interval: 1m
