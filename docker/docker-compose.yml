# Simulate the real mesh: two isolated trusted subnets and a whitelist
# gateway that can reach both, store data, and forward — but has no NVIDIA GPU.
name: ptc-p0

networks:
  seg_a:
    name: ptc-seg-a
    ipam:
      config:
        - subnet: 10.87.0.0/24
  seg_b:
    name: ptc-seg-b
    ipam:
      config:
        - subnet: 10.87.1.0/24

services:
  worker-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ptc:p0
    hostname: worker-a
    networks:
      seg_a:
        ipv4_address: 10.87.0.10
    volumes:
      - ./testdata/worker-a.yaml:/etc/ptc/config.yaml:ro
      - ./testdata/nvidia-smi:/opt/ptc/nvidia-smi:ro
      - a-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /opt/ptc/nvidia-smi /usr/local/bin/nvidia-smi && chmod +x /usr/local/bin/nvidia-smi && exec ptc daemon --config /etc/ptc/config.yaml --data-dir /data

  worker-b:
    image: ptc:p0
    hostname: worker-b
    depends_on:
      - worker-a
    networks:
      seg_b:
        ipv4_address: 10.87.1.10
    volumes:
      - ./testdata/worker-b.yaml:/etc/ptc/config.yaml:ro
      - ./testdata/nvidia-smi:/opt/ptc/nvidia-smi:ro
      - b-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /opt/ptc/nvidia-smi /usr/local/bin/nvidia-smi && chmod +x /usr/local/bin/nvidia-smi && exec ptc daemon --config /etc/ptc/config.yaml --data-dir /data

  gateway:
    image: ptc:p0
    hostname: gateway
    depends_on:
      - worker-a
      - worker-b
    networks:
      seg_a:
        ipv4_address: 10.87.0.2
      seg_b:
        ipv4_address: 10.87.1.2
    volumes:
      - ./testdata/gateway.yaml:/etc/ptc/config.yaml:ro
      - gw-data:/data
    command: ["daemon", "--config", "/etc/ptc/config.yaml", "--data-dir", "/data"]

volumes:
  a-data:
  b-data:
  gw-data:
