# Deploy a small real mesh on one host: a no-GPU gateway, a files node,
# and a read-only WebUI sidecar. This is not the P0-C isolation test
# (that lives in docker/test/). Do not mount mocked GPUs or recorded
# fixture tasks here. The gateway has no GPU and must never be a CUDA
# exec target.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   # optional GPU node:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.cuda.yml up -d --build cuda
#
# Example trusted CIDR is the compose network 10.88.0.0/24. Add your
# real LAN CIDRs in docker/config/*.yaml before joining other machines.
name: ptc

networks:
  mesh:
    name: ptc-mesh
    ipam:
      config:
        - subnet: 10.88.0.0/24

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ptc:local
    hostname: gateway
    restart: unless-stopped
    networks:
      mesh:
        ipv4_address: 10.88.0.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18765:18765/tcp"
      - "18765:18765/udp"
      - "127.0.0.1:18790:18790"
    volumes:
      - ./config/gateway.yaml:/etc/ptc/config.yaml:ro
      - gateway-data:/data
    command: ["daemon", "--config", "/etc/ptc/config.yaml", "--data-dir", "/data"]
    healthcheck:
      test: ["CMD", "ptc", "peers", "--data-dir", "/data"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  files:
    image: ptc:local
    hostname: files
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      mesh:
        ipv4_address: 10.88.0.10
    volumes:
      - ./config/files.yaml:/etc/ptc/config.yaml:ro
      - files-data:/data
    command: ["daemon", "--config", "/etc/ptc/config.yaml", "--data-dir", "/data"]
    healthcheck:
      test: ["CMD", "ptc", "peers", "--data-dir", "/data"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  webui:
    image: ptc:local
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["ptc"]
    command: ["webui", "--listen", "0.0.0.0:18790", "--api", "127.0.0.1:18780"]

volumes:
  gateway-data:
  files-data:
