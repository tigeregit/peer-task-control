# Native Windows host node for the Docker P0 mesh demo.
# The gateway probes host.docker.internal:18765; Docker Desktop delivers
# that connection to this process as 127.0.0.1, so loopback must be trusted.
name: host
listen: 0.0.0.0:18765
api: 127.0.0.1:18780
trusted_cidrs:
  - 127.0.0.0/8
  - 10.87.0.0/24
  - 10.87.1.0/24
services:
  exec: true
  files: true
  relay: false
policy:
  allow: []
  deny: []
scan_interval: 30s
disable_mdns: true
