apiVersion: ptc/v0
kind: PackageResult
metadata:
  name: cuda-vector-add-results
collect:
  from_prepare_outputs: true
  items:
    - name: results
      path: out/results
      required: true
      summary: true
package:
  format: unixfs
  preserve_layout: true
publish:
  class: temporary
  pin: false
  seed:
    name: cuda-vector-add-results
cleanup:
  when: success
  evict_worktree: true
  evict_unpackaged: true
