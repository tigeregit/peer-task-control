apiVersion: ptc/v0
kind: Prepare
metadata:
  name: fake-cuda-scene-a
target:
  services: [exec]
  require_nvidia: true
  deny_non_exec: true
  timeout: 30m
workspace:
  working_directory: "."
  timeout: 30m
  entrypoint: bin/fake_cuda.ps1
  env:
    FAKE_CUDA_MODE: "e2e"
  resources:
    nvidia: true
layout:
  directories:
    - path: in
      class: permanent
      writable: false
    - path: in/sdk
      class: permanent
      writable: false
    - path: in/scene
      class: permanent
      writable: false
    - path: bin
      class: temporary
      writable: false
    - path: out
      class: temporary
      writable: true
    - path: out/results
      class: temporary
      writable: true
    - path: out/logs
      class: temporary
      writable: true
    - path: tmp
      class: temporary
      writable: true
  keep_on_success: false
  keep_on_failure: true
seeds:
  - name: third_party_sdk
    class: permanent
    dest: in/sdk
    local:
      src: sdk
    mode: hardlink
    preserve_layout: true
    required: true
  - name: scene-a
    class: permanent
    dest: in/scene
    local:
      src: scene
    mode: hardlink
    preserve_layout: true
    required: true
  - name: app
    class: temporary
    dest: bin
    required: true
    local:
      src: bin
outputs:
  - name: results
    path: out/results
    class: temporary
    summary: true
  - name: logs
    path: out/logs
    class: temporary
data:
  pin_permanent: true
  evict_temporary_after: 7d
