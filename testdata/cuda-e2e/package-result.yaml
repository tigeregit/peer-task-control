apiVersion: ptc/v0
kind: PackageResult
metadata:
  name: fake-cuda-scene-a-results
collect:
  from_prepare_outputs: true
  items:
    - name: results
      path: out/results
      required: true
      summary: true
    - name: logs
      path: out/logs
      required: false
package:
  format: unixfs
  preserve_layout: true
publish:
  class: temporary
  pin: false
  seed:
    name: fake-cuda-scene-a-results
summary:
  include_exit_code: true
  files:
    - path: out/results/summary.md
      required: true
    - path: out/results/metrics.json
      required: true
cleanup:
  when: success
  evict_worktree: true
  evict_unpackaged: true
