<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ptc</title>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #171717;
      --muted: #f5f5f5;
      --muted-foreground: #737373;
      --border: #e5e5e5;
      --card: #ffffff;
      --primary: #262626;
      --primary-foreground: #fafafa;
      --radius: 0.625rem;
      --success: #1a7f37;
      --failure: #cf222e;
      --progress: #bf8700;
      --queued: #8c959f;
      --log-bg: #0d1117;
      --log-fg: #e6edf3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--background); color: var(--foreground); }
    body {
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    code, .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; }
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    header.top {
      position: sticky; top: 0; z-index: 20;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--background) 90%, transparent);
      backdrop-filter: blur(8px);
    }
    .top-inner, main, footer.foot-inner {
      width: 100%; max-width: 80rem; margin: 0 auto; padding: 0 1.5rem;
    }
    .top-inner { display: flex; align-items: center; gap: 0.75rem; height: 3.5rem; }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; letter-spacing: -0.02em; }
    .logo {
      display: grid; place-items: center; width: 1.75rem; height: 1.75rem;
      border-radius: 0.375rem; background: var(--primary); color: var(--primary-foreground);
    }
    nav.tabs { display: flex; align-items: center; gap: 0.25rem; margin-left: 0.25rem; }
    nav.tabs a, .chip, .btn {
      display: inline-flex; align-items: center; gap: 0.375rem;
      border-radius: 0.375rem; padding: 0.35rem 0.65rem;
      font-size: 0.875rem; color: var(--muted-foreground);
      border: 0; background: transparent; cursor: pointer;
    }
    nav.tabs a:hover, .chip:hover, .btn:hover { background: var(--muted); color: var(--foreground); }
    nav.tabs a.active, .chip.active { background: var(--muted); color: var(--foreground); }
    .right { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
    .lang { display: inline-flex; border: 1px solid var(--border); border-radius: 0.375rem; overflow: hidden; }
    .lang button {
      border: 0; background: transparent; padding: 0.25rem 0.55rem;
      font-size: 0.75rem; color: var(--muted-foreground); cursor: pointer;
    }
    .lang button.on { background: var(--muted); color: var(--foreground); font-weight: 600; }
    .live { font-size: 0.75rem; color: var(--muted-foreground); }
    .dot { width: 0.45rem; height: 0.45rem; border-radius: 99px; background: var(--success); display: inline-block; margin-right: 0.3rem; }
    .dot.off { background: var(--failure); }
    main { flex: 1; padding-top: 1.5rem; padding-bottom: 2rem; }
    footer { border-top: 1px solid var(--border); padding: 1rem 0; text-align: center; font-size: 0.75rem; color: var(--muted-foreground); }
    footer code { background: var(--muted); border-radius: 0.25rem; padding: 0.1rem 0.3rem; }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    .sub { margin: 0.25rem 0 0; font-size: 0.875rem; color: var(--muted-foreground); }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin: 1.5rem 0; }
    @media (min-width: 1024px) { .stats { grid-template-columns: repeat(4, 1fr); } }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.75rem 1rem;
    }
    .card .lbl { font-size: 0.75rem; font-weight: 500; color: var(--muted-foreground); }
    .card .val { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .card .hint { font-size: 0.75rem; color: var(--muted-foreground); }
    .filters { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 1rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    .search { flex: 1; min-width: 12rem; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.4rem 0.65rem; font: inherit; background: var(--card); color: var(--foreground); }
    .sort { border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.4rem 0.5rem; font: inherit; background: var(--card); color: var(--foreground); }
    .hint-count { font-size: 0.75rem; color: var(--muted-foreground); margin-left: auto; }
    a.node { display: block; color: inherit; cursor: pointer; }
    a.node:hover { background: color-mix(in srgb, var(--muted) 50%, transparent); }
    a.node:hover h3 { text-decoration: underline; }
    .list { display: flex; flex-direction: column; gap: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--card); }
    .row {
      display: flex; gap: 0.75rem; align-items: flex-start;
      padding: 0.65rem 0.85rem; border-top: 1px solid var(--border);
      cursor: pointer; position: relative;
    }
    .row:first-child { border-top: 0; }
    .row:hover { background: color-mix(in srgb, var(--muted) 40%, transparent); }
    .row .meta { min-width: 0; flex: 1; }
    .row .title { font-size: 0.875rem; font-weight: 500; }
    .row:hover .title { text-decoration: underline; }
    .row .line { margin-top: 0.2rem; font-size: 0.75rem; color: var(--muted-foreground); display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .row .dur { font-size: 0.75rem; color: var(--muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 0.15rem; }
    .back { font-size: 0.875rem; color: var(--muted-foreground); display: inline-flex; gap: 0.25rem; margin-bottom: 1rem; }
    .back:hover { color: var(--foreground); text-decoration: underline; }
    .run-head { display: flex; align-items: flex-start; gap: 0.65rem; }
    .run-head h1 { font-size: 1.35rem; }
    .badge { display: inline-flex; align-items: center; border-radius: 0.25rem; background: var(--muted); padding: 0.1rem 0.4rem; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted-foreground); }
    .meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem 1.25rem; margin: 1.1rem 0; }
    @media (min-width: 800px) { .meta-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .meta-grid .k { font-size: 0.7rem; font-weight: 500; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.04em; }
    .meta-grid .v { font-size: 0.875rem; margin-top: 0.15rem; word-break: break-all; }
    .summary { border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--card); margin: 0.5rem 0 1.25rem; }
    .summary h2, .jobs h2 { margin: 0 0 0.6rem; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground); }
    .ann { font-size: 0.875rem; margin: 0.4rem 0 0; padding-left: 0.75rem; border-left: 3px solid var(--border); color: var(--foreground); }
    .ann.error { border-color: var(--failure); }
    .ann.warning { border-color: var(--progress); }
    .ann.notice { border-color: var(--success); }
    .jobs { margin-top: 0.5rem; }
    .job { border: 1px solid var(--border); border-radius: 0.5rem; background: var(--card); margin-bottom: 0.6rem; overflow: hidden; }
    .job-h { display: flex; align-items: center; gap: 0.55rem; width: 100%; text-align: left; padding: 0.7rem 0.85rem; border: 0; background: transparent; cursor: pointer; }
    .job-row { display: flex; align-items: center; }
    .job-row .job-h { flex: 1; min-width: 0; }
    .job-row > .copy { margin-right: 0.7rem; }
    .job-h:hover { background: color-mix(in srgb, var(--muted) 40%, transparent); }
    .job-h .nm { flex: 1; font-size: 0.875rem; font-weight: 500; }
    .job-h .tm { font-size: 0.75rem; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    .steps { border-top: 1px solid var(--border); }
    .step { padding: 0.55rem 0.85rem 0.55rem 2.4rem; display: flex; gap: 0.5rem; align-items: flex-start; }
    .step.in_progress { background: color-mix(in srgb, #bf8700 8%, transparent); }
    .step .nm { flex: 1; font-size: 0.8rem; }
    .step .tm { font-size: 0.75rem; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    .log { margin: 0.45rem 0 0.15rem; background: var(--log-bg); color: var(--log-fg); border-radius: 0.4rem; padding: 0.75rem 0.85rem; font-size: 0.75rem; white-space: pre-wrap; max-height: 20rem; overflow: auto; }
    .empty { text-align: center; padding: 3rem 1.5rem; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted-foreground); }
    .nodes { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.25rem; }
    .node { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1rem; background: var(--card); }
    .node h3 { margin: 0 0 0.2rem; font-size: 0.95rem; }
    .node .id { font-size: 0.75rem; color: var(--muted-foreground); word-break: break-all; }
    .svcs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.6rem; }
    .svc { font-size: 0.7rem; border-radius: 0.25rem; padding: 0.15rem 0.4rem; background: var(--muted); color: var(--muted-foreground); }
    .svc.on { background: color-mix(in srgb, var(--success) 15%, white); color: var(--success); }
    .svc.off { background: var(--muted); }
    .icon { width: 1rem; height: 1rem; flex: none; display: inline-block; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chev { width: 0.85rem; height: 0.85rem; color: var(--muted-foreground); transition: transform .15s; }
    .job.open .chev { transform: rotate(90deg); }
    a.seed { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; word-break: break-all; }
    table.res { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.res th, table.res td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid color-mix(in srgb, var(--muted-foreground) 18%, white); vertical-align: middle; }
    table.res th { white-space: nowrap; font-weight: 600; }
    table.res th .th { display: inline-flex; align-items: center; gap: 0.25rem; }
    table.res tbody tr { cursor: pointer; }
    table.res tbody tr:hover { background: var(--muted); }
    .sorter { display: inline-flex; flex-direction: column; line-height: 0; }
    .sorter button { border: 0; background: transparent; padding: 0; margin: 0; color: var(--muted-foreground); cursor: pointer; width: 0.85rem; height: 0.7rem; display: flex; align-items: center; justify-content: center; }
    .sorter button:hover { color: var(--foreground); }
    .sorter button.on { color: var(--foreground); }
    .eye { border: 0; background: transparent; padding: 0; margin: 0; color: var(--muted-foreground); cursor: pointer; width: 1.15rem; height: 1.15rem; display: inline-flex; align-items: center; justify-content: center; border-radius: 0.25rem; }
    .eye:hover, .eye.on { color: var(--foreground); background: var(--muted); }
    td.digest-cell { white-space: nowrap; font-variant-ligatures: none; }
    .with-copy { display: inline-flex; align-items: center; gap: 0.15rem; min-width: 0; max-width: 100%; }
    .with-copy .label { min-width: 0; }
    .copy {
      border: 0; background: transparent; color: var(--muted-foreground);
      cursor: pointer; padding: 0; width: 1.1rem; height: 1.1rem; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 0.25rem; opacity: 0.55;
    }
    .copy:hover, .copy:focus, .copy.ok, .with-copy:hover .copy, .row:hover .copy, tr:hover .copy, h1 .copy, .sub .copy { opacity: 1; }
    .copy:hover, .copy:focus { background: var(--muted); color: var(--foreground); }
    .copy.ok { color: var(--success); }
    .log-wrap { position: relative; }
    .log-wrap .copy { position: absolute; top: 0.4rem; right: 0.4rem; opacity: 0.8; background: color-mix(in srgb, var(--log-bg) 80%, white); color: var(--log-fg); }
    .log-wrap .log { padding-right: 1.8rem; }
    .ftree-sec { }
    .ftree-bar {
      display: flex; align-items: center; gap: 0.4rem;
      margin: 0.55rem 0 0.7rem; padding: 0.4rem 0.65rem;
      border: 1px solid var(--border); border-radius: 0.4rem;
      background: var(--muted); min-width: 0;
    }
    .ftree-bar .path {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 0.75rem; color: var(--muted-foreground);
    }
    .ftree {
      border: 1px solid var(--border); border-radius: 0.5rem; overflow: auto;
      background: var(--card);
    }
    .ftree-row {
      display: grid;
      grid-template-columns: minmax(12rem, 1fr) minmax(8rem, 11rem) 5.2rem minmax(7rem, 12rem);
      gap: 0.4rem; align-items: center;
      min-height: 2rem; padding: 0 0.7rem;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, white);
    }
    .ftree-row:last-child { border-bottom: 0; }
    .ftree-row.head {
      position: sticky; top: 0; z-index: 1;
      min-height: 1.85rem;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em;
      color: var(--muted-foreground); text-transform: none;
      background: color-mix(in srgb, var(--muted) 85%, white);
      border-bottom: 1px solid var(--border);
    }
    .ftree-row:not(.head):hover { background: var(--muted); }
    .ftree-name { display: flex; align-items: center; gap: 0.3rem; min-width: 0; padding-left: calc(var(--d, 0) * 1.1rem); }
    .ftree-name .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.85rem; }
    .ftree-row:not(.head) .ftree-name .label { font-weight: 500; }
    .ft-icon { width: 1.15rem; height: 1.15rem; flex: none; }
    .ft-icon.folder { color: #d9a441; }
    .ft-icon.file { color: #4b5563; }
    .ft-chev-btn {
      border: 0; background: transparent; padding: 0; margin: 0;
      width: 0.95rem; height: 0.95rem; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--muted-foreground); cursor: pointer; border-radius: 0.2rem;
    }
    .ft-chev-btn:hover { color: var(--foreground); background: color-mix(in srgb, var(--foreground) 8%, transparent); }
    .ft-chev { width: 0.75rem; height: 0.75rem; transition: transform .12s; }
    .ft-chev.open { transform: rotate(90deg); }
    .ft-chev-spacer { width: 0.95rem; height: 0.95rem; flex: none; }
    .ftree-role { display: flex; flex-wrap: wrap; gap: 0.25rem; align-items: center; min-width: 0; }
    .ftree-size { font-variant-numeric: tabular-nums; font-size: 0.75rem; color: var(--muted-foreground); text-align: right; white-space: nowrap; }
    .ftree-digest { font-size: 0.75rem; min-width: 0; display: flex; align-items: center; justify-content: flex-end; }
    .ft-chip {
      display: inline-flex; align-items: center; max-width: 100%;
      font-size: 0.68rem; line-height: 1.2; padding: 0.08rem 0.38rem;
      border-radius: 999px; background: var(--muted); color: var(--muted-foreground);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ft-chip.seed { background: color-mix(in srgb, #1f6feb 12%, white); color: #1f6feb; }
    .ft-chip.output { background: color-mix(in srgb, var(--success) 14%, white); color: var(--success); }
    .ft-chip.entry { background: color-mix(in srgb, var(--progress) 18%, white); color: #9a6700; }
    .ftree-row .copy { opacity: 0; }
    .ftree-row:hover .copy, .ftree-row .copy:focus, .ftree-row .copy.ok { opacity: 1; }
    .ftree-row.hint { color: var(--muted-foreground); font-size: 0.78rem; }
    .ftree-row.more { color: #1f6feb; cursor: pointer; }
    .ftree-row.more:hover { background: var(--muted); }
    @media (max-width: 700px) {
      .ftree-row { grid-template-columns: minmax(8rem, 1fr) 5.2rem; }
      .ftree-role, .ftree-digest, .ftree-row.head .ftree-role, .ftree-row.head .ftree-digest { display: none; }
    }
    a.btn { display: inline-block; margin-top: .75rem; padding: .4rem .9rem; border-radius: .4rem; background: #1f6feb; color: #fff; text-decoration: none; font-size: .85rem; }
    a.btn:hover { opacity: .92; }
  </style>
</head>

      list.sort((a, b) => {

        if (field === "name") c = tx(a.name).toLowerCase().localeCompare(tx(b.name).toLowerCase());

        else if (field === "duration") c = taskDurationMs(a) - taskDurationMs(b);
        else c = startedMs(a) - startedMs(b);
        return desc ? -c : c;
      });

    }

        ? withCopy(dig, `<a class="seed" href="${seedHref(dig)}" title="${esc(dig)}">${esc(displayDigest(dig))}</a>`)
        : "";
      let inner = "";
      if (open && isDirUnitPreview(n)) {
        const nfiles = seedFileCount(n.seed);
        inner = `<div class="ftree-row hint" style="--d:${depth+1}">
          <div class="ftree-name"><span class="ft-chev-spacer"></span><span class="label">${esc(i.dirUnitHint(nfiles))}</span></div>
          <div class="ftree-role"><span class="ft-chip">${esc(i.dirUnit)}</span></div>
          <div class="ftree-size">${n.seed && n.seed.size ? esc(humanBytes(n.seed.size)) : ""}</div>
          <div class="ftree-digest"></div>
        </div>`;
      } else if (open) {
        const limit = folderLimit[n.path] || 200;
        const visible = kids.slice(0, limit);
        const rest = kids.length - visible.length;
        const extra = [];
        if (n.seedPending && !kids.length) extra.push(`<div class="ftree-row hint" style="--d:${depth+1}"><div class="ftree-name"><span class="ft-chev-spacer"></span><span class="label">${i.loadingFiles}</span></div><div class="ftree-role"></div><div class="ftree-size"></div><div class="ftree-digest"></div></div>`);
        if (n.seedError && !kids.length) extra.push(`<div class="ftree-row hint" style="--d:${depth+1}"><div class="ftree-name"><span class="ft-chev-spacer"></span><span class="label">${i.loadFailed}</span></div><div class="ftree-role"></div><div class="ftree-size"></div><div class="ftree-digest"></div></div>`);
        inner = visible.map(c => treeNodeHTML(c, depth + 1)).join("") + extra.join("");
        if (rest > 0) {
          const step = Math.min(400, rest);
          inner += `<div class="ftree-row more" style="--d:${depth+1}" onclick="event.stopPropagation(); showMoreFiles('${escAttr(n.path)}', false)">
            <div class="ftree-name"><span class="ft-chev-spacer"></span><span class="label">${i.moreFiles(step)}</span></div>
            <div class="ftree-role"><button type="button" class="ft-chip" onclick="event.stopPropagation(); showMoreFiles('${escAttr(n.path)}', true)">${i.showAllFiles(kids.length)}</button></div>
            <div class="ftree-size"></div><div class="ftree-digest"></div>
          </div>`;
        }
      }
      return `<div class="ftree-row" style="--d:${depth}">
        <div class="ftree-name">${chevron}${n.dir ? folderIcon(open) : fileIcon()}${withCopy(n.path, `<span class="label" title="${esc(n.path)}">${esc(n.name)}</span>`)}</div>
        <div class="ftree-role">${roles.join("")}</div>
        <div class="ftree-size">${esc(size)}</div>
        <div class="ftree-digest">${digest}</div>
      </div>${inner}`;
    }

    function linkSeeds(text) {
      return esc(text).replace(/sha256:[a-fA-F0-9]{64}/g, m => {
        const hex = m.slice(7).toLowerCase();
        const full = "sha256:" + hex;
        return withCopy(full, `<a class="seed" href="#/resources/sha256/${hex}">${full}</a>`);
      });
    }
    function humanBytes(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + " B";
      const units = ["KiB","MiB","GiB","TiB"];
      let i = -1, v = n;
      do { v /= 1024; i++; } while (v >= 1024 && i < units.length-1);
      return (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + " " + units[i];
    }
    function seedHref(digest) {
      const m = String(digest||"").toLowerCase().replace(/^sha256:/,"");
      return "#/resources/sha256/" + m;
    }
    function esc(s) { return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
    function escAttr(s) { return esc(s).replace(/`/g,""); }


    function renderResources() {
      const i = t();
      const all = resourcesBoard.seeds || [];
      const seeds = filteredResources();
      const viewer = resourcesBoard.viewer || (status && status.name) || "—";
      const rows = seeds.map(s => {
        const hops = minHops(s);
        const hopsText = hops >= 1e9 ? "—" : String(hops);
        return `<tr onclick="location.hash='${seedHref(s.digest)}'">
          <td class="mono digest-cell">${withCopy(s.digest, `<a class="seed" href="${seedHref(s.digest)}" title="${esc(s.digest)}">${esc(displayDigest(s.digest))}</a>`)}</td>
          <td class="mono" title="${esc(s.cid || "")}">${s.cid ? withCopy(s.cid, esc(shortCid(s.cid))) : "—"}</td>
          <td>${withCopy(s.name, esc(s.name || "—"))}</td>
          <td>${withCopy(s.kind, esc(s.kind || ""))}</td>
          <td>${withCopy(String(s.size ?? ""), humanBytes(s.size))}</td>
          <td>${withCopy(String((s.locations||[]).length), String((s.locations||[]).length))}</td>
          <td>${s.created_at ? withCopy(s.created_at, esc(fmtDate(s.created_at))) : "—"}</td>
          <td>${hopsText === "—" ? "—" : withCopy(hopsText, hopsText)}</td>
        </tr>`;
      }).join("");
      return `${header("resources")}<main>
        <h1>${i.resTitle}</h1>
        <p class="sub">${i.resSub(all.length, viewer)}</p>
        <div class="toolbar">
          <input id="q" class="search" type="search" value="${esc(resQuery)}" placeholder="${esc(i.searchRes)}" oninput="setResQuery(this.value)" autocomplete="off">
          ${seeds.length !== all.length ? `<span class="hint-count">${i.showing(seeds.length, all.length)}</span>` : ""}
        </div>
        <div class="filters">
          <button class="chip ${resKind==="all"?"active":""}" onclick="setResKind('all')">${i.kindAll}</button>
          <button class="chip ${resKind==="tree"?"active":""}" onclick="setResKind('tree')">${i.kindTree}</button>
          <button class="chip ${resKind==="blob"?"active":""}" onclick="setResKind('blob')">${i.kindBlob}</button>
        </div>
        ${seeds.length ? `<table class="res"><thead><tr>
          <th><span class="th">digest ${eyeBtn()}${colSort("digest")}</span></th>
          <th><span class="th">CID</span></th>
          <th><span class="th">${lang==="zh"?"名称":"Name"}${colSort("name")}</span></th>
          <th><span class="th">${i.kind}${colSort("kind")}</span></th>
          <th><span class="th">${i.size}${colSort("size")}</span></th>
          <th><span class="th">${i.resNodes}${colSort("nodes")}</span></th>
          <th><span class="th">${i.created}${colSort("created")}</span></th>
          <th><span class="th">${i.minHops}${colSort("hops")}</span></th>
        </tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">${i.noResources}</div>`}
      </main>${footer()}`;
    }
    function renderResource(digest) {
      const i = t();
      const seeds = resourcesBoard.seeds || [];
      const info = seeds.find(s => (s.digest || "").toLowerCase() === (digest || "").toLowerCase());
      if (!info) return `${header("resources")}<main><a class="back" href="#/resources">← ${i.allResources}</a><div class="empty">${i.noResources}</div></main>${footer()}`;
      const hex = (info.digest || "").replace(/^sha256:/i, "");
      const locRows = (info.locations||[]).map(l => {
        const via = i["via_" + (l.via || "")] || l.via || "—";
        return `<tr>
          <td>${withCopy(l.node || l.peer_id, nodeLink(l.node, l.peer_id))}</td>
          <td class="mono">${withCopy(l.peer_id, esc(l.peer_id || ""))}</td>
          <td>${withCopy(String(l.hops), String(l.hops))}</td>
          <td>${esc(via)}</td>
          <td>${l.connected ? i.yes : i.no}${l.local ? " · " + i.via_local : ""}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="5">—</td></tr>`;
      const fileRows = (info.files||[]).map(f => `<tr>
        <td class="mono">${withCopy(f.path, esc(f.path))}</td>
        <td class="mono">${f.digest ? withCopy(f.digest, `<a class="seed" href="${seedHref(f.digest)}">${esc(f.digest)}</a>`) : "—"}</td>
        <td>${withCopy(String(f.size ?? ""), humanBytes(f.size))}</td>
      </tr>`).join("");
      return `${header("resources")}<main>
        <a class="back" href="#/resources">← ${i.allResources}</a>
        <h1>${withCopy(info.name || info.digest, esc(info.name || info.digest))}</h1>
        <p class="sub mono">${withCopy(info.digest, esc(info.digest))}</p>
        ${info.cid ? `<p class="sub mono">CID ${withCopy(info.cid, esc(info.cid))}</p>` : ""}
        <div class="meta-grid">
          <div><div class="k">${i.kind}</div><div class="v">${withCopy(info.kind, esc(info.kind || "—"))}</div></div>
          <div><div class="k">${i.size}</div><div class="v">${withCopy(String(info.size ?? ""), humanBytes(info.size))}</div></div>
          <div><div class="k">${i.replicas}</div><div class="v">${withCopy(String((info.locations||[]).length), String((info.locations||[]).length))}</div></div>
          <div><div class="k">${i.hopsFrom}</div><div class="v">${withCopy(resourcesBoard.viewer || (status && status.name) || "", esc(resourcesBoard.viewer || (status && status.name) || "—"))}</div></div>
        </div>
        <section class="summary">
          <h2>${i.locations}</h2>
          <table class="res"><thead><tr>
            <th>${i.nodesCount}</th><th>peer</th><th>${i.hops}</th><th>${i.via}</th><th>${i.connected}</th>
          </tr></thead><tbody>${locRows}</tbody></table>
          <a class="btn" href="/live/resources/sha256/${hex}/content">${i.download}</a>
        </section>
        ${fileRows ? `<section class="summary"><h2>${i.files}</h2><table class="res"><thead><tr><th>path</th><th>digest</th><th>${i.size}</th></tr></thead><tbody>${fileRows}</tbody></table></section>` : ""}
      </main>${footer()}`;
    }

    function render() {
      const active = document.activeElement;
      const restoreId = (active && (active.id === "q" || active.id === "sort")) ? active.id : "";
      const start = restoreId && typeof active.selectionStart === "number" ? active.selectionStart : null;
      const end = restoreId && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
      const r = route();
      let html = "";
      if (r.page === "nodes") html = renderNodes();
      else if (r.page === "node") html = renderNode(r.id);
      else if (r.page === "resources") html = renderResources();
      else if (r.page === "resource") html = renderResource(r.digest);
      else if (r.page === "task") html = renderTask(r.id);
      else html = renderTasks();
      document.getElementById("app").innerHTML = html;
      if (restoreId) {
        const el = document.getElementById(restoreId);
        if (el) {
          el.focus();
          if (start != null && el.setSelectionRange) {
            try { el.setSelectionRange(start, end); } catch (_) {}
          }
        }
      }
    }

    async function refresh() {
      try {
        const [tb, st, rs] = await Promise.all([
          fetch("/live/tasks").then(r => r.json()),
          fetch("/live/status").then(r => r.ok ? r.json() : Promise.reject(new Error(r.statusText))),
          fetch("/live/resources").then(r => r.ok ? r.json() : { seeds: [] }).catch(() => ({ seeds: [] }))
        ]);
        tasksBoard = tb || { tasks: [] };
        resourcesBoard = rs || { seeds: [] };
        status = st;
        statusErr = null;
        if (status && status.peers) {
          /* include self in count when catalog already has it */
        }
      } catch (e) {
        statusErr = e;
        try { tasksBoard = await fetch("/live/tasks").then(r => r.json()); } catch (_) {}
      }
      render();
    }

    window.setLang = setLang;
    window.toggleJob = toggleJob;
    window.toggleFolder = toggleFolder;
    window.showMoreFiles = showMoreFiles;
    window.setFilter = setFilter;
    window.setTaskQuery = setTaskQuery;
    window.setTaskSort = setTaskSort;
    window.setResQuery = setResQuery;
    window.setResSort = setResSort;
    window.setResColSort = setResColSort;
    window.toggleDigest = toggleDigest;
    window.setResKind = setResKind;
    window.copyFrom = copyFrom;
    window.render = render;
    window.addEventListener("hashchange", render);
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
