name: Feature request
description: Suggest a new capability or a behavior change
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please check [docs/ROADMAP.md](https://github.com/tigeregit/peer-task-control/blob/main/docs/ROADMAP.md) first (Chinese: [docs/zh/ROADMAP.md](https://github.com/tigeregit/peer-task-control/blob/main/docs/zh/ROADMAP.md)) and confirm this is not already planned or explicitly out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Can the existing CLI / skill / WebUI already do this?
