name: Bug report
description: Report a reproducible error
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [docs/CONTRIBUTING.md](https://github.com/tigeregit/peer-task-control/blob/main/docs/CONTRIBUTING.md) first (Chinese: [docs/zh/CONTRIBUTING.md](https://github.com/tigeregit/peer-task-control/blob/main/docs/zh/CONTRIBUTING.md)).
        **Do not** paste a PSK, SSH private key, identity.key, or any other credential.
  - type: textarea
    id: version
    attributes:
      label: ptc version
      description: Paste the full output of `ptc version`.
      placeholder: 0.3.0-dev
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 22.04
    validations:
      required: true
  - type: dropdown
    id: segment
    attributes:
      label: Cross-segment?
      options:
        - Same segment
        - Cross-segment (through a gateway)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: You may attach redacted config, but do not include secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: You may attach a log summary. For mesh issues, attach a redacted `ptc peers` output (node names and roles may stay).
    validations:
      required: true
